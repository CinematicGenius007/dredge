[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

# Versions below were read from the crates.io API on 2026-10-27 (cargo was unavailable for `cargo add`).
[workspace.dependencies]
dredge-core = { path = "crates/dredge-core" }
dredge-scan = { path = "crates/dredge-scan" }
dredge-mcp = { path = "crates/dredge-mcp" }

# serde: derive Serialize/Deserialize for the output envelope and snapshot header
serde = { version = "1.0.229", features = ["derive"] }
# serde_json: the one JSON document every command prints, and the snapshot header
serde_json = "1.0.154"
# schemars: generate `dredge schema` from the real output types so it cannot drift
schemars = "1.2.3"
# thiserror: typed errors in library crates
thiserror = "2.0.21"
# anyhow: error plumbing in binaries only
anyhow = "1.0.104"
# clap: argument parsing for the CLI
clap = { version = "4.6.7", features = ["derive"] }
# rayon: work-stealing pool for parallel directory scanning
rayon = "1.12.0"
# zstd: snapshot body compression
zstd = "0.14.3"
# sysinfo (disk only): cross-platform volume listing without cfg code
sysinfo = { version = "0.39.6", default-features = false, features = ["disk"] }
# dirs: OS-specific local data directory for snapshots
dirs = "7.0.0"
# rustc-hash: fast hasher for name interning, file-id grouping and extension totals
rustc-hash = "2.1.3"
# jiff: RFC 3339 timestamps and snapshot age
jiff = "0.2.38"
# rmcp: official Rust MCP SDK
rmcp = { version = "3.8.0", features = ["server", "transport-io"] }
# tokio: async runtime required by rmcp; also scan jobs and idle timers
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
# tempfile: fixture trees in tests (dev only)
tempfile = "3.27.0"
# libc: getrusage for peak memory in the benchmark, unix stat helpers
libc = "0.2.191"
# windows-sys: directory enumeration with allocation size, volume serial, peak working set
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
