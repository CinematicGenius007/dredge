name: Bug report
description: Something dredge does wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security issues here. See SECURITY.md.
  - type: input
    id: version
    attributes:
      label: dredge version
      description: Output of `dredge --version`, or the commit SHA if you built from a clone.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options:
        - CLI
        - MCP server
        - Tests or library
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact commands or MCP calls, and the fixture or path you used.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The JSON or error text. Redact personal paths and user names.
      render: json
