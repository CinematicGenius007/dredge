[advisories]
# Reject every advisory; dependencies are upgraded instead of suppressing advisories.
# Exception: RUSTSEC-2026-0543 (chrono unmaintained, all versions affected, no patched release).
# chrono is only reached through rmcp's hard schemars "chrono04" feature (still present in rmcp
# 3.11), so we cannot drop it. It is unused by dredge code. Remove this once rmcp stops needing it.
ignore = ["RUSTSEC-2026-0543"]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  # Required by option-ext, a transitive dependency of dirs for OS-specific data paths.
  "MPL-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
